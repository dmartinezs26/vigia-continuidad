name: Vigía

on:
  # Lo dispara cron-job.org cada 5 minutos (llama a workflow_dispatch con un token
  # limitado a Actions de este repositorio). El horario propio de GitHub se quitó
  # porque se atrasaba y causaba revisiones dobles.
  workflow_dispatch:
    inputs:
      prueba:
        description: "Mandar un mensaje de prueba a Telegram"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Revisar fuentes y avisar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PANEL_URL: ${{ vars.PANEL_URL }}
          VIGIA_PRUEBA: ${{ inputs.prueba }}
        run: python3 vigia.py

      - name: Guardar estado en el repositorio
        run: |
          git config user.name "vigia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/estado.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "estado $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            if git pull -q --rebase && git push -q; then exit 0; fi
            echo "No se pudo guardar (intento $i), reintentando..."; sleep $((i*5))
          done
          echo "::error::No se pudo guardar docs/estado.json en el repositorio"; exit 1

      - name: Generar resumen en texto (para Copilot y lectores)
        run: node tools/resumen.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
