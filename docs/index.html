  --dark:#111116; --dark-2:#24232C; --dark-ink:#B9B7C6; --soft:#F5F4F8; --es-grey-bg:#ECEBF1;
}
html.M{color-scheme:light;

/* ===== Estado en vivo: lo escribe el vigía cada hora en db (estado/actual) ===== */
var EST=null,EST_OK=false,EST_SUBS=[];
var NIV={ok:'Operativo',aviso:'Con avisos',mant:'Mantenimiento',degradado:'Degradado',caida:'Caída',sin_dato:'Sin datos'};
var NIVH={ok:'Todo operativo',aviso:'Hay avisos',degradado:'Servicio degradado',caida:'Caída en curso',sin_dato:'Sin datos del vigía'};
var EST_LINKS=[['Genesys Cloud','https://status.mypurecloud.com/'],['AWS Health','https://health.aws.amazon.com/health/status'],['Azure','https://azure.status.microsoft/'],['Microsoft 365','https://status.cloud.microsoft/']];
function safeUrl(u){return typeof u==='string'&&/^https:\/\//.test(u)?u:null}
function E(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function estAge(){if(!EST||!EST.revisado)return null;return Math.round((Date.now()-Date.parse(EST.revisado))/60000)}
function estLevel(){if(!EST)return 'sin_dato';var a=estAge();if(a!=null&&a>(/minuto/.test(EST.intervalo||'')?20:150))return 'viejo';return EST.nivel||'sin_dato'}
function ago(min){if(min==null)return '';if(min<1)return 'recién';if(min<60)return 'hace '+min+' min';var h=Math.round(min/60);if(h<48)return 'hace '+h+' h';return 'hace '+Math.round(h/24)+' días'}
function chTime(iso){try{return new Intl.DateTimeFormat('es-CL',{timeZone:'America/Santiago',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(iso)).replace('.','')}catch(e){return iso}}
function estChip(st){return E('span','es-chip es-'+(st==='mant'?'aviso':st||'sin_dato'),NIV[st]||'Sin datos')}
function estHead(){
  var lv=estLevel();
  if(lv==='sin_dato')return {lv:lv,t:EST_OK?'El vigía aún no ha reportado':'Conectando con el vigía…',s:'Revisa los estados oficiales mientras tanto.'};
  if(lv==='viejo')return {lv:lv,t:'El vigía no reporta '+ago(estAge()),s:'El último dato puede estar desactualizado. Revisa los estados oficiales.'};
  return {lv:lv,t:EST.titular||NIVH[lv],s:'Revisado '+ago(estAge())+' · Genesys, AWS y Microsoft'};
}
function estBanner(onOpen){
  var h=estHead();var b=E('button','es-banner es-'+h.lv);b.type='button';b.setAttribute('aria-label','Estado: '+h.t+'. Ver detalle');
  b.appendChild(E('span','es-dot'));var t=E('span','es-txt');t.appendChild(E('b',null,h.t));t.appendChild(E('span',null,h.s));b.appendChild(t);
  b.appendChild(E('span','es-go','Ver estado →'));b.addEventListener('click',onOpen);return b;
}
function estSvc(s){
  var r=E('div','es-svc');r.appendChild(E('span','es-n',s.n));r.appendChild(estChip(s.estado));
  var x=E('span','es-x',s.nota||'');if(s.afectados&&s.afectados.length)x.textContent=(s.nota?s.nota+' · ':'')+'Afectado: '+s.afectados.join(', ');r.appendChild(x);
  if(safeUrl(s.url)){var a=E('a',null,'Ver estado oficial ↗');a.href=safeUrl(s.url);a.target='_blank';a.rel='noopener';a.style.gridColumn='1/-1';r.appendChild(a)}
  return r;
}
function estCard(title,sub,list){
  var c=E('div','es-card');var h=E('div','es-h');h.appendChild(E('b',null,title));if(sub)h.appendChild(E('small',null,sub));c.appendChild(h);
  if(!list.length)c.appendChild(E('p','es-empty','Sin servicios vigilados aquí.'));list.forEach(function(s){c.appendChild(estSvc(s))});return c;
}
function estIncs(title,list,empty){
  var s=E('div','es-sec');s.appendChild(E('h3',null,title));var c=E('div','es-card');
  if(!list||!list.length)c.appendChild(E('p','es-empty',empty));
  (list||[]).forEach(function(i){var r=E('div','es-inc');r.appendChild(E('b',null,i.t));
    r.appendChild(E('span',null,[i.fuente,i.region,i.estado,i.desde?'desde '+chTime(i.desde):'',i.act?'actualizado '+chTime(i.act):''].filter(Boolean).join(' · ')));
    if(safeUrl(i.url)){var a=E('a',null,'Ver incidente ↗');a.href=safeUrl(i.url);a.target='_blank';a.rel='noopener';a.style.fontSize='12px';a.style.fontWeight='700';r.appendChild(a)}c.appendChild(r)});
  s.appendChild(c);return s;
}
function estView(){
  var v=E('div','es');var h=estHead();
  var hero=E('div','es-hero es-'+h.lv);hero.appendChild(E('span','es-k','Estado en vivo · Lo primero que hay que mirar'));hero.appendChild(E('h2',null,h.t));
  if(EST&&EST.detalle)hero.appendChild(E('p',null,EST.detalle));else hero.appendChild(E('p',null,h.s));
  var m=E('div','es-meta');if(EST&&EST.revisado){m.appendChild(E('span',null,'Última revisión: '+chTime(EST.revisado)+' hora de Chile ('+ago(estAge())+')'))}
  m.appendChild(E('span',null,'El vigía revisa '+((EST&&EST.intervalo)||'cada hora')+' y avisa si algo afecta use1 o sae1'));hero.appendChild(m);v.appendChild(hero);
  var S=(EST&&EST.servicios)||[];
  if(EST&&(EST.incidentes||[]).length)v.appendChild(estIncs('Incidentes que nos afectan',EST.incidentes,''));
  var rs=E('div','es-sec');rs.appendChild(E('h3',null,'Nuestras regiones'));var g=E('div','es-grid');
  g.appendChild(estCard('US East · use1','N. Virginia',S.filter(function(s){return s.region==='use1'})));
  g.appendChild(estCard('São Paulo · sae1','Brasil',S.filter(function(s){return s.region==='sae1'})));
  rs.appendChild(g);v.appendChild(rs);
  var gs=E('div','es-sec');gs.appendChild(E('h3',null,'Dependencias globales'));var g2=E('div','es-grid');
  var glob=S.filter(function(s){return s.region!=='use1'&&s.region!=='sae1'});
  var grp={};glob.forEach(function(s){(grp[s.grupo]=grp[s.grupo]||[]).push(s)});
  Object.keys(grp).forEach(function(k){g2.appendChild(estCard(k,null,grp[k]))});
  if(!glob.length)g2.appendChild(estCard('Microsoft y telefonía',null,[]));gs.appendChild(g2);v.appendChild(gs);
  if(EST&&!(EST.incidentes||[]).length)v.appendChild(estIncs('Incidentes que nos afectan',[],'Ninguno abierto en use1, sae1 ni en las dependencias vigiladas.'));
  if(EST&&EST.eventos){var es=E('div','es-sec');es.appendChild(E('h3',null,'Eventos operacionales de nuestra organización'));var ec=E('div','es-card');
    if(!EST.eventos.length)ec.appendChild(E('p','es-empty','Sin eventos en los últimos 10 días. Llegan desde la Operational Console por EventBridge.'));
    EST.eventos.slice(0,10).forEach(function(x){var r=E('div','es-inc');r.appendChild(E('b',null,x.t));r.appendChild(E('span',null,[x.defid,x.entidad,x.region,x.ts?chTime(x.ts):''].filter(Boolean).join(' · ')));ec.appendChild(r)});
    es.appendChild(ec);v.appendChild(es)}
  v.appendChild(estIncs('En otras regiones',EST&&EST.otros,'Sin incidentes abiertos en otras regiones.'));
  var hi=(EST&&EST.historial)||[];
  if(hi.length){var hs=E('div','es-sec');hs.appendChild(E('h3',null,'Últimas revisiones'));var c=E('div','es-card');var bar=E('div','es-hist');
    hi.slice(-48).forEach(function(x){var i=E('i','es-'+(x.nivel||'sin_dato'));i.title=chTime(x.at)+' · '+(NIV[x.nivel]||'Sin datos');bar.appendChild(i)});c.appendChild(bar);
    var l=E('div','es-hist-l');l.appendChild(E('span',null,chTime(hi.slice(-48)[0].at)));l.appendChild(E('span',null,'ahora'));c.appendChild(l);hs.appendChild(c);v.appendChild(hs)}

/* ----- Estado ----- */

/* ----- Cambios ----- */
var SEGS=[{id:'dep',n:'Retiros',f:function(i){return i.k==='dep'}},{id:'viene',n:'Viene',f:function(i){return i.k==='ui'||i.k==='plat'}},{id:'rel',n:'Liberado',f:function(i){return i.k==='rel'}},{id:'api',n:'APIs',f:function(i){return i.k==='api'}}];
function sCambios(){
  var v=el('section','screen');var h=el('div');h.appendChild(el('h1','title','Cambios'));h.appendChild(el('p','sub','Todo lo anunciado por Genesys, por tipo.'));v.appendChild(h);
  var seg=el('div','seg');SEGS.forEach(function(s){var b=el('button',null,s.n);b.type='button';b.appendChild(el('span','n',String(ITEMS.filter(s.f).length)));b.setAttribute('aria-pressed',String(M.seg===s.id));b.addEventListener('click',function(){M.seg=s.id;render()});seg.appendChild(b)});v.appendChild(seg);
  var cur=SEGS.filter(function(s){return s.id===M.seg})[0]||SEGS[0];var list=ITEMS.filter(cur.f);
  if(cur.id==='dep')list.sort(byDate);
  else if(cur.id==='viene')list.sort(function(a,b){var x=(a.eff?0:1)-(b.eff?0:1);if(x)return x;var y=IMP[a.imp]-IMP[b.imp];return y||b.ann.localeCompare(a.ann)});
  else if(cur.id==='rel')list.sort(function(a,b){return b.rel.localeCompare(a.rel)});
  else list.sort(function(a,b){return (b.eff||b.ann).localeCompare(a.eff||a.ann)});
  var l=el('div','list');if(!list.length)l.appendChild(el('p','empty','Sin cambios en esta categoría.'));list.forEach(function(i){l.appendChild(item(i,true))});v.appendChild(l);
  return v;
}

/* ----- Agenda ----- */
function sAgenda(){
  var v=el('section','screen');var R=region();var h=el('div','hd');var ht=el('div','hd-t');ht.appendChild(el('h1','title','Agenda'));
  ht.appendChild(el('p','sub',R.n+' recibe cambios los '+['domingo','lunes','martes','miércoles','jueves','viernes','sábado'][R.d]+' a la 01:00 hora local.'));h.appendChild(ht);h.appendChild(regionPicker());v.appendChild(h);
  var ev=[];nextRel(R,75).forEach(function(r){if(!r.f)ev.push({k:r.iso,iso:r.iso,t:'Liberación '+R.id,x:ftm(r.at)+' hora de Chile',c:''})});
  FREEZES.forEach(function(f){if(f.to>=TODAY)ev.push({k:f.from<TODAY?TODAY:f.from,iso:f.from<TODAY?TODAY:f.from,t:'Congelado · '+frange(f),x:f.why+' · sin liberaciones',c:'frz'})});
  ITEMS.forEach(function(i){if(i.eff&&i.k!=='rel'){var d=diff(i.eff);if(d>=0&&d<=120&&(i.imp==='Alto'||i.imp==='Medio'||i.act==='Acción requerida'))ev.push({k:i.eff,iso:i.eff,t:i.t,x:KIND[i.k]+' · '+rel(d),c:'dep',it:i})}});
  WEBINARS.forEach(function(w){var t=Date.parse(w.at);if(t>NOW){var iso=isoIn(t,TZ);ev.push({k:iso,iso:iso,t:w.n,x:'Webinar · '+ftm(t)+' · '+w.x,c:'web'})}});
  ev.sort(function(a,b){return a.k.localeCompare(b.k)});
  var tl=el('div','tl');ev.slice(0,14).forEach(function(e){
    var r=el(e.it?'button':'div','ev');if(e.it){r.type='button';r.style.border='0';r.style.background='transparent';r.style.width='100%';r.style.textAlign='left';r.style.cursor='pointer';r.addEventListener('click',function(){openS(e.it)})}
    var d=el('div','d',fd(e.iso));d.appendChild(el('span',null,new Intl.DateTimeFormat('es-CL',{timeZone:'UTC',weekday:'short'}).format(new Date(ms(e.iso))).replace('.','')));r.appendChild(d);
    var rl=el('div','rail');rl.appendChild(el('span','dot '+e.c));r.appendChild(rl);
    var x=el('div','e');x.appendChild(el('div','t',e.t));x.appendChild(el('div','x',e.x));r.appendChild(x);tl.appendChild(r)});
  v.appendChild(tl);return v;
}

var sheet=document.getElementById('sheet'),scrim=document.getElementById('mscrim'),cur=null,lastF=null;
function when(i){if(i.eff){var d=diff(i.eff);return fdl(i.eff)+' ('+rel(d)+')'}if(i.rel)return 'Liberado el '+fdl(i.rel);return (i.ann?'Anunciado el '+fdl(i.ann)+'; ':'')+'aún sin fecha'}
function openS(i){
  cur=i;lastF=document.activeElement;var s=status(i);
  var ch=document.getElementById('s-chip');ch.textContent='';ch.appendChild(el('span','chip '+s.c,s.lbl+' · '+KIND[i.k]));
  document.getElementById('s-t').textContent=i.t;document.getElementById('s-en').textContent=i.en;
  var kv=document.getElementById('s-kv');kv.textContent='';
  [['Qué cambia',i.s],['Cuándo',when(i)],['A quién',audTxt(i)],['Impacto',i.imp||'Sin dato'],['Qué hacer',i.do||(i.act==='Acción requerida'?'Revisar si aplica y actuar antes de la fecha.':'Revisar con tiempo si afecta a la operación.')]].forEach(function(p){kv.appendChild(el('dt',null,p[0]));kv.appendChild(el('dd',null,p[1]))});
  document.getElementById('s-link').href=i.url;sheet.hidden=false;scrim.hidden=false;document.getElementById('s-copy').focus();
}
function closeS(){sheet.hidden=true;scrim.hidden=true;if(lastF&&lastF.focus)lastF.focus()}
document.getElementById('s-close').addEventListener('click',closeS);scrim.addEventListener('click',closeS);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!sheet.hidden)closeS()});
var tt=null;function toast(m){var t=document.getElementById('mtoast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},2400)}
function copy(txt,ok){
  function fb(){var c=document.getElementById('mclip');c.value=txt;c.select();var done=false;try{done=document.execCommand('copy')}catch(e){}toast(done?ok:'No se pudo copiar automáticamente')}
  try{navigator.clipboard.writeText(txt).then(function(){toast(ok)},fb)}catch(e){fb()}
}
document.getElementById('s-copy').addEventListener('click',function(){var i=cur;
  copy(['Aviso Genesys Cloud: '+i.t,'','Qué cambia: '+i.s,'A quién afecta: '+audTxt(i),'Cuándo: '+when(i),'Qué hacer: '+(i.do||'Revisar si aplica.'),'Más info: '+i.url,'','Diego Martínez Sánchez','Ingeniero de Continuidad Operacional · e-contact'].join('\n'),'Aviso copiado')});
function copySummary(){
  var R=region();var L=['Continuidad Genesys Cloud · '+fdl(TODAY),''];
  var U=urgent();L.push('Urgente:');if(!U.length)L.push('- Nada vence en los próximos 30 días');U.forEach(function(i){L.push('- '+i.t+': '+fd(i.eff)+' ('+rel(diff(i.eff))+')')});
  L.push('','Este mes:');month().forEach(function(i){L.push('- '+i.t+(i.k==='rel'?' (liberado '+fd(i.rel)+')':' (anunciado, sin fecha)'))});
  var first=nextRel(R,90).filter(function(x){return !x.f})[0];if(first)L.push('','Próxima liberación '+R.id+': '+fdl(first.iso)+', '+ftm(first.at)+' hora de Chile');
  L.push('','Diego Martínez Sánchez · Continuidad Operacional · e-contact');copy(L.join('\n'),'Resumen copiado');
}
